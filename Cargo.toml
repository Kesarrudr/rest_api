[package]
name = "mining-pool-api"
version = "0.1.0"
edition = "2021"

[dependencies]
diesel = { version = "2.0", features = ["postgres", "uuid", "r2d2"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
